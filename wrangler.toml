name = "app-achados-e-perdidos"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Variáveis de ambiente (não commite valores reais)
# Defina via Cloudflare Dashboard > Pages > Settings > Environment variables
# [vars]
# VITE_SUPABASE_URL = ""
# VITE_SUPABASE_ANON_KEY = ""
# VITE_STORAGE_PASSPHRASE = ""

# Headers de segurança globais
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-cache para service worker e manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# SPA fallback ( HashRouter já cuida disso, mas por segurança )
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200