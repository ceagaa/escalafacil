<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fundo escuro arredondado -->
  <rect width="512" height="512" rx="80" fill="#1e2636"/>

  <!-- Anéis do calendário -->
  <rect x="155" y="52" width="26" height="60" rx="8" fill="#5a6577"/>
  <rect x="331" y="52" width="26" height="60" rx="8" fill="#5a6577"/>

  <!-- Barra do calendário -->
  <rect x="110" y="95" width="292" height="14" rx="4" fill="#5a6577"/>

  <!-- Grid do calendário (9 quadrados 3x3) -->
  <!-- Linha 1 -->
  <rect x="138" y="140" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="222" y="140" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="306" y="140" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <!-- Linha 2 -->
  <rect x="138" y="210" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="222" y="210" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="306" y="210" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <!-- Linha 3 -->
  <rect x="138" y="280" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="222" y="280" width="68" height="56" rx="6" fill="#2e3a4d"/>
  <rect x="306" y="280" width="68" height="56" rx="6" fill="#2e3a4d"/>

  <!-- Pessoa esquerda -->
  <circle cx="185" cy="215" r="30" fill="#4a5568"/>
  <path d="M140 330 C140 275 185 275 185 275 C185 275 230 275 230 330 Z" fill="#4a5568"/>

  <!-- Pessoa centro (maior) -->
  <circle cx="256" cy="200" r="36" fill="#4a5568"/>
  <path d="M200 340 C200 270 256 270 256 270 C256 270 312 270 312 340 Z" fill="#4a5568"/>

  <!-- Pessoa direita -->
  <circle cx="327" cy="215" r="30" fill="#4a5568"/>
  <path d="M282 330 C282 275 327 275 327 275 C327 275 372 275 372 330 Z" fill="#4a5568"/>

  <!-- Checkmark verde -->
  <circle cx="378" cy="380" r="78" fill="#6cc927"/>
  <polyline points="338,380 368,412 422,348" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
